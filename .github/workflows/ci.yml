name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install pnpm and yarn pack oracles
        run: npm install -g pnpm@10 yarn@1.22.22
      - run: npm test
      - name: Require committed dist to match src
        run: git diff --exit-code -- dist
      - name: Run packgate on this package
        run: node dist/cli.js --fail-on-severity high
      - name: Example gitignore footgun still fails
        env:
          GITHUB_ACTIONS: ""
        run: |
          printf 'EXAMPLE_ONLY=not-a-live-secret\n' > examples/leaky-files-field/.env
          set +e
          node dist/cli.js examples/leaky-files-field
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected packgate to exit 1 on the leaky example, got ${status}" >&2
            exit 1
          fi

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke the GitHub Action entrypoint
        env:
          INPUT_PATH: .
          INPUT_FAIL_ON_SEVERITY: high
          INPUT_REPORT_FORMAT: markdown
          INPUT_SCAN_CONTENTS: "true"
          INPUT_GIT: "true"
          INPUT_ORACLE: auto
          PACKGATE_ACTION: "1"
        run: node dist/action.js
